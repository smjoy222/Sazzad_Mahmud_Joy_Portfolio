<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            overflow: hidden;
        }
        
        .viewer-header {
            background: #16213e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0ef;
        }
        
        .viewer-title {
            color: #0ef;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .close-btn {
            background: #0ef;
            color: #1a1a2e;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: #0dd;
            transform: scale(1.05);
        }
        
        .pdf-container {
            width: 100%;
            height: calc(100vh - 60px);
        }
        
        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ef;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="viewer-header">
        <div class="viewer-title">📄 Certificate Viewer</div>
        <button class="close-btn" onclick="window.close()">Close</button>
    </div>
    
    <div class="loading" id="loading">Loading certificate...</div>
    
    <div class="pdf-container">
        <iframe id="pdfFrame" class="pdf-frame" style="display:none;"></iframe>
    </div>
    
    <script>
        // Get PDF URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('pdf');
        
        if (pdfUrl) {
            const iframe = document.getElementById('pdfFrame');
            const loading = document.getElementById('loading');
            
            iframe.onload = function() {
                loading.style.display = 'none';
                iframe.style.display = 'block';
            };
            
            // Decode and set the PDF source
            iframe.src = decodeURIComponent(pdfUrl);
        } else {
            document.getElementById('loading').textContent = 'No certificate specified';
        }
    </script>
</body>
</html>
